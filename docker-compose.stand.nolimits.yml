# Переопределение для одного конкретного вопроса: куда уходит память.
# На NAS процесс вырастает с 0.9 до 5.3 ГиБ за одну волну и ниже 4.8 уже не опускается.
# Под лимитом в 15 ГБ не видно, где он остановится, — здесь лимиты подняты до возможностей
# машины, чтобы это выяснить.
#
#   docker compose -f docker-compose.stand.yml -f docker-compose.stand.nolimits.yml up -d
#
# Для всего остального пользоваться обычным стендом: без лимитов дефекты конкуренции
# за базу не воспроизводятся.

services:
  app:
    cpus: 16
    mem_limit: 60g
