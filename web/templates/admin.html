<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Управление сервисом — KZ Price Hunter</title>
  <script>
    (function () {
      let theme = 'light';
      try {
        const saved = localStorage.getItem('kz_theme');
        if (saved === 'dark' || saved === 'light') theme = saved;
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root, [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
    }
    [data-theme="dark"] {
      --bg: #0a0f1c;
      --card: #131b2e;
      --border: #27324a;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; }
    .back { color: var(--muted); font-size: 0.9rem; text-decoration: none; }
    .back:hover { color: var(--text); }
    h1 { margin: 16px 0 24px; font-size: 1.6rem; }
    .card {
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .card p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    .card a {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 8px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">‹ На сайт</a>
    <h1>Управление сервисом</h1>
    <div class="card">
      <p>Новая страница администрирования в разработке. Пока сканеры, настройки и мониторинг открываются в прежней панели.</p>
      <a href="/dashboard">Открыть прежнюю панель</a>
    </div>
  </main>
</body>
</html>
