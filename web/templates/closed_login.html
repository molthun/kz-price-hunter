<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Price Hunter</title>
<script>
try {const mode=localStorage.getItem('kz_theme_mode')||localStorage.getItem('kz_theme');document.documentElement.dataset.theme=['dark','light'].includes(mode)?mode:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}
</script>
<style>
:root{color-scheme:light dark;--bg:#f7f9fc;--card:#fff;--text:#172033;--muted:#56667c;--border:#d9e1ed;--button:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0b101c;--card:#141e30;--text:#eef2fc;--muted:#a8b6cc;--border:#30415b}}
[data-theme=light]{color-scheme:light;--bg:#f7f9fc;--card:#fff;--text:#172033;--muted:#56667c;--border:#d9e1ed}
[data-theme=dark]{color-scheme:dark;--bg:#0b101c;--card:#141e30;--text:#eef2fc;--muted:#a8b6cc;--border:#30415b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}
main{width:100%;max-width:460px;padding:28px;border:1px solid var(--border);border-radius:18px;background:var(--card);text-align:center;box-shadow:0 12px 40px #0000000d}
.brand{font-weight:800;font-size:21px}.brand span{display:inline-block;background:var(--button);color:white;border-radius:7px;padding:3px 7px;margin-right:8px;font-size:15px}h1{font-size:25px;line-height:1.25;margin:26px 0 12px}p{color:var(--muted)}button{min-height:44px;padding:10px 18px;border:0;border-radius:9px;background:var(--button);color:#fff;font:inherit;cursor:pointer}button.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}#widget{display:flex;justify-content:center;margin:20px 0;min-height:44px}#status{overflow-wrap:anywhere}#pendingActions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}#pendingActions[hidden],[hidden]{display:none!important}#identity{overflow-wrap:anywhere}noscript{display:block;margin-top:20px}
</style>
</head>
<body>
<main id="closedLogin">
<div class="brand"><span>KZ</span>Price Hunter</div>
<h1 id="title">Вход на закрытый сайт</h1>
<p id="description">Сайт находится в закрытой разработке. Доступ открыт только пользователям, подтверждённым владельцем.</p>
<p id="identity" hidden></p>
<div id="directBotArea" style="margin: 16px 0;" hidden>
 <a id="directBotLink" href="#" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#2481cc;color:#fff;font-weight:600;padding:12px 20px;border-radius:10px;text-decoration:none;min-height:44px;box-shadow:0 2px 8px rgba(36,129,204,0.3);width:100%;max-width:280px;margin:0 auto 12px;">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z" fill="currentColor"/></svg>
  <span>Открыть Telegram-бот</span>
 </a>
 <div style="font-size:12px;color:var(--muted);margin-top:4px;">или через виджет ниже:</div>
</div>
<div id="widget"></div><div id="devLogin"></div>
<div id="pendingActions" hidden><button id="refresh" type="button">Проверить доступ</button><button id="logout" class="secondary" type="button">Выйти</button></div>
<p id="status" role="status">Проверяем доступ…</p>
<button id="retry" type="button" hidden>Повторить</button>
<noscript>Для входа включите JavaScript в браузере.</noscript>
</main>
<script>
let lastWidget='',checking=false,botPollTimer=null,botLinkReady=false;
const byId=id=>document.getElementById(id);
async function post(path,body){
 const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
 const data=await res.json();if(!res.ok)throw Error(data.message||'Не удалось выполнить вход. Повторите попытку.');return data;
}
window.onTelegramAuth=async user=>{try{byId('status').textContent='Выполняем вход…';await post('/api/auth/telegram',user);await checkAccess();}catch(e){byId('status').textContent=e.message;}};
window.addEventListener('message',function(e){
 if(!e.origin||!e.origin.includes('telegram.org'))return;
 try{const d=typeof e.data==='string'?JSON.parse(e.data):e.data;if(d&&d.event==='auth_result'&&d.result)onTelegramAuth(d.result);}catch(err){}
});
function stopBotPoll(){if(botPollTimer)clearInterval(botPollTimer);botPollTimer=null;}
function hideBotLink(){botLinkReady=false;const a=byId('directBotArea');if(a)a.hidden=true;const l=byId('directBotLink');if(l)l.href='#';}
async function initClosedBotAuth(){
 // Кнопка бота показывается только с настоящей ссылкой: пустой href="#" вёл в никуда
 stopBotPoll();botPollTimer=-1;
 try{
  const res=await post('/api/auth/bot-start');
  if(botPollTimer!==-1)return; // пока ждали ответ, вход уже случился или опрос отменён
  if(res.status!=='ok'||!res.bot_url||!res.token){stopBotPoll();hideBotLink();return;}
  byId('directBotLink').href=res.bot_url;botLinkReady=true;byId('directBotArea').hidden=false;
  botPollTimer=setInterval(async()=>{
   let pRes;try{pRes=await fetch('/api/auth/bot-poll?token='+encodeURIComponent(res.token),{cache:'no-store'});}catch(e){return;}
   let pData={};try{pData=await pRes.json();}catch(e){}
   if(pRes.ok&&pData.status==='ok'){stopBotPoll();byId('status').textContent='✅ Вход выполнен!';location.reload();return;}
   if(pRes.ok)return;
   // 410 — ссылка истекла: берём новую; 403/404/400 — опрос бессмысленен, говорим причину
   stopBotPoll();hideBotLink();
   if(pRes.status===410){byId('status').textContent='Ссылка для входа устарела — получаем новую.';initClosedBotAuth();}
   else byId('status').textContent=pData.message||'Не удалось выполнить вход. Повторите попытку.';
  },1500);
 }catch(e){stopBotPoll();hideBotLink();}
}
async function checkAccess(){
 if(checking)return;checking=true;byId('retry').hidden=true;
 try{
  const res=await fetch('/api/me',{cache:'no-store'});if(!res.ok)throw Error('Не удалось проверить доступ. Повторите попытку.');
  const data=await res.json(),user=data.user,auth=data.auth||{};
  // 6.36.0: в режиме по времени страница показывается, только когда время гостя или пробного входа вышло
  const access=data.access||{},timed=!data.maintenance_mode&&access.mode==='timed';
  const blocked=data.maintenance_mode?!(user&&(user.is_confirmed||user.is_admin)):access.allowed===false;
  if(!blocked){location.reload();return;}
  byId('pendingActions').hidden=!user;byId('identity').hidden=!user;byId('widget').hidden=!!user;byId('devLogin').hidden=!!user;
  const directArea=byId('directBotArea');
  if(user||!auth.bot_username){stopBotPoll();hideBotLink();}
  else{directArea.hidden=!botLinkReady;if(!botPollTimer)initClosedBotAuth();}
  if(user){
   byId('title').textContent=timed?'Пробное время закончилось':'Ожидание подтверждения';
   byId('description').textContent=timed?'30 минут пробного доступа прошли. Владелец подтвердит ваш аккаунт — и сайт откроется без ограничений. Утром он получает список тех, кто ждёт.':'Вы вошли. Владелец должен подтвердить доступ к сайту.';
   byId('identity').textContent=user.first_name||user.username||'Пользователь';byId('status').textContent='Доступ пока не подтверждён.';
  }else{
   byId('title').textContent=timed?'Гостевые 10 минут закончились':'Вход на закрытый сайт';byId('identity').textContent='';
   byId('description').textContent=timed?'Войдите через Telegram — откроется ещё 30 минут, а после подтверждения владельцем доступ станет без ограничений.':'Сайт находится в закрытой разработке. Войдите через Telegram для доступа.';
   byId('status').textContent=auth.bot_username?(timed?'Вход занимает пару секунд.':'После входа потребуется подтверждение владельца.'):'Вход временно недоступен. Попробуйте позже.';
   if(auth.bot_username&&lastWidget!==auth.bot_username){
    byId('widget').replaceChildren();
    const ifr=document.createElement('iframe');
    ifr.src='https://oauth.telegram.org/embed/'+encodeURIComponent(auth.bot_username)+'?origin='+encodeURIComponent(location.origin)+'&return_to='+encodeURIComponent(location.href)+'&size=large&request_access=write&radius=12';
    ifr.width='238';ifr.height='40';ifr.frameBorder='0';ifr.scrolling='no';ifr.style.border='none';ifr.style.overflow='hidden';
    byId('widget').append(ifr);lastWidget=auth.bot_username;
   }
   byId('devLogin').replaceChildren();if(auth.dev_login){const b=document.createElement('button');b.textContent='Вход разработчика';b.onclick=async()=>{try{await post('/api/auth/dev-login');await checkAccess();}catch(e){byId('status').textContent=e.message;}};byId('devLogin').append(b);}
  }
 }catch(e){byId('status').textContent='Не удалось проверить доступ. Повторите попытку.';byId('retry').hidden=false;}
 finally{checking=false;}
}
byId('refresh').onclick=checkAccess;byId('retry').onclick=checkAccess;
byId('logout').onclick=async()=>{try{await post('/api/auth/logout');location.reload();}catch(e){byId('status').textContent=e.message;}};
async function start(){
 // Preserve signed Telegram Mini App login without opening the application shell.
 const s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';s.async=true;
 s.onload=async()=>{try{const tg=window.Telegram&&Telegram.WebApp;if(tg&&tg.initData){tg.ready();await post('/api/auth/telegram-webapp',{init_data:tg.initData});await checkAccess();}}catch(e){byId('status').textContent='Войдите через Telegram повторно.';}};
 document.head.append(s);await checkAccess();
}
start();setInterval(()=>{if(!document.hidden)checkAccess();},15000);
</script>
</body></html>
