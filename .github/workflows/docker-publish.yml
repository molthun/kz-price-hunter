name: Build and Publish Docker Image

# Шлюз выката (P16): образ публикуется только после того, как прошли ВСЕ обязательные проверки —
# тесты, браузерные регрессии, поиск секретов, уязвимости зависимостей, репетиция обновления базы
# предыдущего релиза и smoke по собранному образу. Непрошедшая проверка останавливает публикацию.

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Check Python syntax (compileall)
        run: python -m compileall -q .

      - name: Run tests with coverage
        # Все наборы test_*.py: новый файл тестов попадает в проверку перед выкатом автоматически.
        # Порог 80%: текущий замер 84%, запас на новую ветку кода без тестов не бесконечен.
        run: |
          coverage run --rcfile=.coveragerc -m unittest discover -s . -p "test_*.py"
          coverage report --rcfile=.coveragerc --fail-under=80

  # Браузерные регрессии интерфейса (XSS, вход, окно товара) в предустановленном Chrome раннера
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install Playwright for Node (same version as Python)
        run: npm install --no-save --no-package-lock playwright@1.63.0

      - name: Run browser tests
        env:
          TEST_PYTHON: python
        run: for f in tests/frontend/test_frontend*.cjs; do echo "== $f"; node "$f" || exit 1; done

  # Ключи и токены не должны попадать ни в репозиторий, ни в образ
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Scan sources for secrets
        run: python release_gate.py secrets --root .

  # Уязвимости зависимостей: пропуск действует только с причиной и до указанной даты
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # pip-audit сам по себе останавливает шаг, поэтому отчёт пишется всегда, а решение принимает шлюз
        run: pip-audit -r requirements.txt -f json -o audit.json || true

      - name: Apply the gate to the audit report
        run: python release_gate.py deps audit.json

  # Репетиция обновления: база предыдущего релиза → новый код → миграции → запросы приложения → целостность
  upgrade-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for the previous tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Create a database of the previous release
        # Базу выбирает release_gate baseline, а не «старший semver-тег»: в сборке по main тег
        # текущего выпуска указывает на тот же коммит, и репетиция сверяла релиз сам с собой —
        # проходила, ничего не проверяя (B13). Гейт отбрасывает теги выпускаемого коммита и
        # теги, не являющиеся его предками. Оба SHA пишутся в сводку job и в артефакт.
        run: |
          python release_gate.py baseline --root . > baseline.json || true
          cat baseline.json
          PREV=$(python -c "import json;print(json.load(open('baseline.json')).get('tag') or '')")
          PREV_SHA=$(python -c "import json;print(json.load(open('baseline.json')).get('sha') or '')")
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Предыдущий релиз: ${PREV:-нет подходящего тега, берём текущий код}"
          {
            echo "### Репетиция обновления"
            echo "- выпускаемый коммит: \`${CURRENT_SHA}\`"
            echo "- предыдущий релиз: \`${PREV:-нет}\` (\`${PREV_SHA:-нет}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" = "$CURRENT_SHA" ]; then
            echo "База репетиции совпала с выпускаемым коммитом — так проверять нечего" >&2
            exit 1
          fi
          rm -rf prev-release prev-data && mkdir -p prev-data
          if [ -n "$PREV" ]; then
            git worktree add --detach prev-release "$PREV"
          else
            git worktree add --detach prev-release HEAD
          fi
          cd prev-release && DATA_DIR="$GITHUB_WORKSPACE/prev-data" python -c "import database; database.init_db()"

      - name: Save the rehearsal baseline
        # Артефакт нужен разбору: по нему видно, с каким именно релизом сверялось обновление
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-baseline
          path: baseline.json
          if-no-files-found: warn

      - name: Rehearse the upgrade with the new code
        # Обновлённая база сохраняется: проверка отката должна идти именно по ней, а не по исходной
        run: python release_gate.py upgrade prev-data/prices.db --keep upgraded.db

      # Равенство версии схемы — условие необходимое, но не достаточное: на ОБНОВЛЁННОЙ базе
      # запускается САМ прежний релиз, иначе обещание отката ничем не подтверждено (M07)
      - name: Rehearse the rollback with the previous release code on the upgraded database
        run: python release_gate.py rollback upgraded.db prev-release

  # Сборка образа и smoke по нему ДО публикации: отвечающий контейнер — ещё не работающий сервис
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: kz-price-hunter:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install smoke dependencies
        run: pip install aiohttp

      - name: Start the container
        run: |
          docker run -d --name smoke -p 35539:35539 -e ALLOW_DEV_LOGIN=0 kz-price-hunter:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:35539/api/version >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Smoke the running image
        run: python release_gate.py smoke http://127.0.0.1:35539

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Stop the container
        if: always()
        run: docker rm -f smoke || true

  build-and-push:
    needs: [test, frontend, secret-scan, dependency-audit, upgrade-rehearsal, image-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Без авто-latest для semver-тегов: latest (его забирает Watchtower на проде) публикуется только из main
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
