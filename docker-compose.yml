version: '3.8'

services:
  kz-price-hunter:
    build: .
    image: ghcr.io/molthun/kz-price-hunter:latest
    container_name: kz-price-hunter
    restart: unless-stopped
    ports:
      - "35539:35539"
    environment:
      - DATA_DIR=/app/data
      - TZ=Asia/Almaty
      - PORT=35539
      # Адрес панели для кнопки в Telegram-уведомлениях (например, https://ваш-домен)
      - APP_URL=${APP_URL}
      # Токен Telegram-бота (вход на сайте и уведомления) и администраторы (Telegram ID через запятую).
      # Значения берутся из .env рядом с docker-compose.yml — не храните их в git.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
    volumes:
      - ./data:/app/data

  watchtower:
    image: containrrr/watchtower:latest
    container_name: kz-price-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    command: --interval 300 kz-price-hunter
