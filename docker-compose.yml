version: '3.8'

services:
  kz-price-hunter:
    build: .
    image: ghcr.io/molthun/kz-price-hunter:latest
    container_name: kz-price-hunter
    restart: unless-stopped
    ports:
      - "35539:35539"
    environment:
      - DATA_DIR=/app/data
      - TZ=Asia/Almaty
      - PORT=35539
      # Адрес панели для кнопки в Telegram-уведомлениях (например, https://ваш-домен)
      - APP_URL=${APP_URL}
      # Canonical browser origin; blank falls back to APP_URL in the application.
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      # Exact observed proxy peer IP/CIDR, not the public NAT address.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - ALLOW_DEV_LOGIN=0
      # Токен Telegram-бота (вход на сайте и уведомления) и администраторы (Telegram ID через запятую).
      # Значения берутся из .env рядом с docker-compose.yml — не храните их в git.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
    volumes:
      - ./data:/app/data
    # Ротация логов: без неё json-лог контейнера растёт без предела (M11)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: kz-price-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    command: --interval 300 kz-price-hunter
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
