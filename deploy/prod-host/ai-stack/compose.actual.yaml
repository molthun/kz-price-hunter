services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Одна модель в видеопамяти, один запрос за раз; модель не выгружается сама — её освобождают
      # кнопка «AI выкл» или проверка видеокарты при игре (kz-price-hunter docs/AI_LOCAL_POLICY.md, 29.10.2026)
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "11434:11434"
    volumes:
      - /srv/ssd/ai-stack/ollama:/root/.ollama
    # Видеокарта через CDI: с «gpus: all» контейнер терял доступ к ней после перечитывания настроек
    # systemd («Failed to initialize NVML: Unknown Error») и молча считал на процессоре (29.10.2026)
    devices:
      - nvidia.com/gpu=all

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/ssd/ai-stack/portainer:/data

  # Поиск артикулов для третьего источника истины (kz-price-hunter P17-C7, решение владельца 29.10.2026):
  # без ключей, JSON-выдача; слушает только адрес машины в локальной сети
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "192.168.28.25:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://192.168.28.25:8888/
    volumes:
      - /srv/ssd/ai-stack/searxng:/etc/searxng
    mem_limit: 512m
    cpus: 1.0
