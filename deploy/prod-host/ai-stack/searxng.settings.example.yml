# SearXNG для kz-price-hunter (P17-C7): поиск артикулов, только JSON для сервиса во внутренней сети.
# На сервере: /srv/ssd/ai-stack/searxng/settings.yml (права 600; контейнер делает владельцем своего пользователя).
use_default_settings: true
general:
  instance_name: "kzph-search"
search:
  safe_search: 0
  default_lang: "ru"
  formats:
    - html
    - json
server:
  secret_key: "<openssl rand -hex 32, задаётся на сервере>"
  limiter: false
  image_proxy: false
  public_instance: false
ui:
  static_use_hash: true
# Поисковики общего поиска (обновлено 05.11.2026):
# выключены те, что требуют платных ключей, возвращают капчу или блокируют IP (brave, google, google cse, wikidata)
# включены проверенные стабильные движки: duckduckgo, startpage, mojeek
engines:
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: brave
    disabled: true
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: wikidata
    disabled: true
  - name: bing
    disabled: true
  - name: yandex
    disabled: true
  - name: qwant
    disabled: true
