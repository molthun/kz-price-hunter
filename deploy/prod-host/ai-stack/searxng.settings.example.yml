# SearXNG для kz-price-hunter (P17-C7): поиск артикулов, только JSON для сервиса во внутренней сети.
# На сервере: /srv/ssd/ai-stack/searxng/settings.yml (права 600; контейнер делает владельцем своего пользователя).
use_default_settings: true
general:
  instance_name: "kzph-search"
search:
  safe_search: 0
  default_lang: "ru"
  formats:
    - html
    - json
server:
  secret_key: "<openssl rand -hex 32, задаётся на сервере>"
  limiter: false
  image_proxy: false
  public_instance: false
ui:
  static_use_hash: true
# Поисковики общего поиска (P17-C7, 29.10.2026): bing через SearXNG отдаёт мусор (рецепты на запрос артикула),
# yandex не разбирается, qwant отказывает — выключены; mojeek и startpage — в помощь основным
engines:
  - name: bing
    disabled: true
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: yandex
    disabled: true
  - name: qwant
    disabled: true
