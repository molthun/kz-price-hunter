# Живой сервер (с 22.11.2026): стенд стал единственным рабочим сервером, см. docs/archive/SINGLE_LIVE_MIGRATION.md.
# Подключается поверх docker-compose.stand.yml:
#   docker compose -f docker-compose.stand.yml -f docker-compose.live.yml up -d app
services:
  app:
    # Живой сервер поднимается после сбоя и перезагрузки машины
    restart: unless-stopped
    environment:
      # Перенаправлять старый адрес на канонический PUBLIC_ORIGIN (GET/HEAD → 301 с путём и query)
      CANONICAL_REDIRECT_HOSTS: ${CANONICAL_REDIRECT_HOSTS:-shdev.molthun.ru}
    ports:
      # Порт старого прода: DSM-прокси shop.molthun.ru ведёт на 192.168.28.25:35540
      - "35540:35539"
