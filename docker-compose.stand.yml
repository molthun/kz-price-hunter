# Испытательный стенд (не прод). Запускается на отдельной Linux-машине и намеренно
# ограничен до ресурсов NAS: четыре ядра и 15 ГБ. Это главное условие — на свободной
# машине дефекты конкуренции за базу и очередь прячутся, волна перестаёт обрываться,
# и стенд показывает «всё хорошо» там, где прод теряет данные.
#
#   docker compose -f docker-compose.stand.yml up -d --build
#
# Полный порядок, перенос копии базы и список сценариев проверки — docs/TEST_STAND.md.

services:
  app:
    build: .
    image: kzph-stand:local
    container_name: kzph-stand
    env_file: .env

    # Та же пара значений, что на NAS: 4 ядра, 15 ГБ. Снимать их только осознанно,
    # отдельным файлом-переопределением (см. docker-compose.stand.nolimits.yml).
    cpus: 4
    mem_limit: 15g

    # Стенд не перезапускается сам: упавший контейнер должен остаться упавшим, иначе
    # сценарии с рестартом и потерей задач будет нечем наблюдать.
    restart: "no"

    environment:
      - PORT=35539
      - DATA_DIR=/app/data
      - TZ=Asia/Almaty

    ports:
      # Только локальная сеть. Наружу стенд не выставлять: на нём отладочные настройки
      # и копия рабочих данных.
      - "35539:35539"

    volumes:
      # Каталог должен лежать на NVMe или SSD. Сетевые шары не годятся: SQLite на них
      # ведёт себя непредсказуемо, а файл базы уже около 2 ГБ.
      - ./stand-data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
